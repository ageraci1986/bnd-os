##
## NexusHub — ClamAV daemon config
## Override of the image default at /etc/clamav/clamd.conf.
## Key change vs default: TCPAddr binds to 0.0.0.0 so Fly's proxy can
## forward TCP INSTREAM traffic from the public port 3310 to clamd.
## Default binds to 127.0.0.1 only → proxy returns ECONNREFUSED and
## every scan silently fails.
##

LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 10M
LogFileUnlock yes
LogRotate yes
LogVerbose no

PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
LocalSocketGroup clamav
LocalSocketMode 666

TCPSocket 3310
TCPAddr 0.0.0.0

User clamav
ExitOnOOM yes
# Recharger la base SANS en garder deux copies en mémoire (défaut : yes =
# ~2× la RAM de la base pendant le reload). Le reload concurrent a tué clamd
# par OOM le 2026-09-05 (machine 2 Go) et rien ne l'a relancé : tous les
# scans échouaient (fail-closed). Le reload bloque les scans quelques
# secondes, ce qui est acceptable.
ConcurrentDatabaseReload no
Foreground no

MaxConnectionQueueLength 32
MaxThreads 12
ReadTimeout 180
CommandReadTimeout 30
SendBufTimeout 200
IdleTimeout 30

MaxDirectoryRecursion 20
FollowDirectorySymlinks no
FollowFileSymlinks no

DetectPUA no
ScanPE yes
DisableCertCheck no
ScanELF yes
ScanOLE2 yes
OLE2BlockMacros no
ScanPDF yes
ScanSWF yes
ScanMail yes
ScanArchive yes
ArchiveBlockEncrypted no

MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 10M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M

StreamMaxLength 100M

HeuristicScanPrecedence no
StructuredDataDetection no
